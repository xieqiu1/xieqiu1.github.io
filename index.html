}

<body>

<div class="flower f2">🌿</div>

<div class="flower f4">🌼</div>
<div class="flower f5">🌱</div>

<div class="wrap">
<p>Hello 大家好</p>

<p>很高兴你来到这里</p>

<div id="time-box">
📅 <span id="datetime"></span>
<div

<div id="gameBox">
<h3>🎮 弹弹珠小游戏（打砖块） <span class="score-text">得分：<span id="score">0</span></span></h3>
<canvas id="gameCanvas" width="600" height="350"></canvas>
<button id="startBtn">开始游戏</button>
</div>

<script>
// 时钟代码
function updateTime(){
    const now = new Date();
    const year = now.getFullYear();
    const month = now.getMonth()+1;
    const day = now.getDate();
    const weekArr = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
    const week = weekArr[now.getDay()];
    const h = String(now.getHours()).padStart(2,'0');
    const m = String(now.getMinutes()).padStart(2,'0');
    const s = String(now.getSeconds()).padStart(2,'0');
    document.getElementById("datetime").innerText = `${year}年${month}月${day}日 ${week} ${h}:${m}:${s}`;
}
updateTime();
setInterval(updateTime,1000);

// ========== 弹弹珠打砖块游戏 ==========
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreDom = document.getElementById('score');
const startBtn = document.getElementById('startBtn');

let gameRunning = false;
let score = 0;

// 小球
let ballX = canvas.width / 2;
let ballY = canvas.height - 60;
let ballR = 8;
let dx = 4;
let dy = -4;

// 挡板
const paddleW = 100;
const paddleH = 12;
let paddleX = canvas.width / 2 - paddleW / 2;
const paddleY = canvas.height - 25;

// 砖块
const brickRow = 4;
const brickCol = 7;
const brickW = 70;
const brickH = 18;
const brickPad = 6;
const brickTop = 30;
const brickLeft = 10;
let bricks = [];

function initBricks(){
    score = 0;
    scoreDom.innerText = score;
    for(let r=0; r<brickRow; r++){
        bricks[r] = [];
        for(let c=0; c<brickCol; c++){
            bricks[r][c] = {
                x: c*(brickW+brickPad)+brickLeft,
                y: r*(brickH+brickPad)+brickTop,
                alive: true
            }
        }
    }
}
initBricks();

// 鼠标控制挡板
canvas.addEventListener('mousemove', (e)=>{
    const rect = canvas.getBoundingClientRect();
    paddleX = e.clientX - rect.left - paddleW/2;
    if(paddleX < 0) paddleX = 0;
    if(paddleX + paddleW > canvas.width) paddleX = canvas.width - paddleW;
})

// 手机触摸滑动控制挡板
canvas.addEventListener('touchmove', (e)=>{
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const touch = e.touches[0];
    paddleX = touch.clientX - rect.left - paddleW/2;
    if(paddleX < 0) paddleX = 0;
    if(paddleX + paddleW > canvas.width) paddleX = canvas.width - paddleW;
})

function drawBall(){
    ctx.beginPath();
    ctx.arc(ballX, ballY, ballR, 0, Math.PI*2);
    ctx.fillStyle="#fff";
    ctx.fill();
    ctx.closePath();
}
function drawPaddle(){
    ctx.fillStyle="#42a5f5";
    ctx.fillRect(paddleX, paddleY, paddleW, paddleH);
}
function drawBricks(){
    for(let r=0; r<brickRow; r++){
        for(let c=0; c<brickCol; c++){
            const b = bricks[r][c];
            if(b.alive){
                ctx.fillStyle="#ef5350";
                ctx.fillRect(b.x,b.y,brickW,brickH);
            }
        }
    }
}

function collision(){
    for(let r=0; r<brickRow; r++){
        for(let c=0; c<brickCol; c++){
            const b = bricks[r][c];
            if(b.alive){
                if(ballX > b.x && ballX < b.x+brickW && ballY > b.y && ballY < b.y+brickH){
                    dy = -dy;
                    b.alive = false;
                    score += 10;
                    scoreDom.innerText = score;
                }
            }
        }
    }
}

function loop(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    drawBricks();
    drawBall();
    drawPaddle();
    collision();

    if(gameRunning){
        // 左右边界反弹
        if(ballX + dx < ballR || ballX + dx > canvas.width - ballR) dx = -dx;
        // 顶部反弹
        if(ballY + dy < ballR) dy = -dy;
        // 碰到挡板
        if(ballY + dy > paddleY - ballR && ballX > paddleX && ballX < paddleX + paddleW){
            dy = -dy;
        }
        // 掉到底，游戏结束
        if(ballY + dy > canvas.height){
            gameRunning = false;
            startBtn.innerText = "重新开始";
        }
        ballX += dx;
        ballY += dy;
    }
    requestAnimationFrame(loop);
}
loop();

// 开始按钮事件
startBtn.onclick = function(){
    // 重置小球位置
    ballX = canvas.width / 2;
    ballY = canvas.height - 60;
    dx = 4;
    dy = -4;
    initBricks();
    gameRunning = true;
    startBtn.innerText = "游戏中";
}
</script>

</body>
</html>
