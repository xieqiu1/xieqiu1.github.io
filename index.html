<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的小站</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
body{
    background-color:#fefbf6;
    font-family:system-ui, sans-serif;
    padding:20px 12px;
}
.wrap{
    background: rgba(255,255,255,0.78);
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08), 0 0 20px rgba(255,248,230,0.4);
    position: relative;
    z-index: 1;
    max-width:700px;
    margin:0 auto;
}
.douyin-link{
    display:inline-block;
    padding:9px 18px;
    background:#67c29c;
    color:#fff;
    text-decoration:none;
    border-radius:999px;
    transition: all 0.25s ease;
}
.douyin-link:hover{
    background:#25b864;
    color:#000;
    transform: scale(1.03);
    box-shadow: 0 3px 8px rgba(103, 194, 156,0.35);
}
#time-box{
    margin:10px 0;
    font-size:16px;
    color:#555;
}
#musicBox{
    margin:25px 0;
}
</style>
</head>
<body>
<div class="wrap">

    <div id="time-box">
        📅 <span id="datetime"></span>
    </div>

    <p style="margin:15px 0;">
        <a class="douyin-link" href="你的抖音链接" target="_blank">🎵 抖音</a>
    </p>

    <p style="margin:15px 0;">
        <a class="douyin-link" href="你的B站主页链接" target="_blank">📺 B站</a>
    </p>

    <p style="margin:15px 0;color:#555;">
        我会更新一些有趣的视频
    </p>

    <div id="musicBox">
        <h3>🎵 我的歌单</h3>
        <meting-js
            server="netease"
            type="playlist"
            id="你的歌单ID"
            theme="#67c29c">
        </meting-js>
    </div>

    <!-- ========== 弹弹珠游戏入口+弹窗 ========== -->
    <p style="margin:25px 0;">
        <a class="douyin-link" id="openGameBtn" href="javascript:void(0)">🎮 去玩弹弹珠小游戏</a>
    </p>
    <div id="gameModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:10;display:flex;align-items:center;justify-content:center;padding:15px;">
        <div style="background:#fff;padding:20px;border-radius:16px;max-width:620px;width:100%;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
                <h3>🎮 弹弹珠小游戏 <span class="score-text">得分：<span id="score">0</span></span></h3>
                <a id="closeGameBtn" href="javascript:void(0)" style="text-decoration:none;color:#666;">✖ 关闭</a>
            </div>
            <canvas id="gameCanvas" width="600" height="340" style="width:100%;border:2px solid #ddd;border-radius:12px;background:#111;"></canvas>
            <div style="margin-top:10px;display:flex;gap:10px;align-items:center;">
                <a class="douyin-link" id="startGameBtn" href="javascript:void(0)">▶ 开始游戏</a>
                <span style="color:#666;font-size:14px;">手机：左右滑动屏幕控制挡板</span>
            </div>
        </div>
    </div>
   <!-- 2048游戏入口按钮 -->
<p style="margin:25px 0;">
<a class="douyin-link" id="open2048Btn" href="javascript:void(0)">🧩 2048小游戏</a>
</p>

<!-- 2048弹窗，默认隐藏 -->
<div id="game2048Modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:11;display:flex;align-items:center;justify-content:center;padding:15px;">
    <div style="background:#fff;padding:20px;border-radius:16px;max-width:420px;width:100%;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
            <h3>🧩 2048｜得分：<span id="score2048">0</span></h3>
            <a id="close2048Btn" href="javascript:void(0)" style="text-decoration:none;color:#666;">✖ 关闭</a>
        </div>
        <div id="grid2048" style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:#bbada0;padding:8px;border-radius:8px;">
        </div>
        <div style="margin-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
            <a class="douyin-link" id="start2048Btn" href="javascript:void(0)">▶ 开始游戏</a>
            <span style="color:#666;font-size:14px;">电脑方向键 / 手机上下左右滑动</span>
        </div>
    </div>
</div>
 

<script>
// 时钟
function updateTime(){
    const now = new Date();
    document.getElementById('datetime').innerText = now.toLocaleString('zh-CN');
}
updateTime();
setInterval(updateTime,1000);
</script>

<!-- 弹弹珠 JS -->
<script>
const modal = document.getElementById('gameModal');
const openBtn = document.getElementById('openGameBtn');
const closeBtn = document.getElementById('closeGameBtn');
const startGameBtn = document.getElementById('startGameBtn');
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreDom = document.getElementById('score');

let gameRunning = false;
let score = 0;
let ballX = canvas.width/2, ballY = canvas.height-60;
let ballR = 8;
let dx = 2.2, dy = -2.2;
let paddleW = 110, paddleH = 14;
let paddleX = canvas.width/2 - paddleW/2;
const paddleY = canvas.height - 25;
const row = 4, col = 7;
const brickW = 72, brickH = 16;
const brickPad = 8;
let bricks = [];

function initBricks(){
    bricks = [];
    for(let r=0;r<row;r++){
        for(let c=0;c<col;c++){
            bricks.push({
                x: c*(brickW+brickPad)+10,
                y: r*(brickH+brickPad)+10,
                w:brickW, h:brickH, alive:true
            })
        }
    }
}

canvas.onmousemove = e=>{
    if(!gameRunning) return;
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    paddleX = x - paddleW/2;
    if(paddleX<0) paddleX=0;
    if(paddleX+paddleW>canvas.width) paddleX = canvas.width-paddleW;
}
canvas.ontouchmove = e=>{
    e.preventDefault();
    if(!gameRunning) return;
    const rect = canvas.getBoundingClientRect();
    const x = e.touches[0].clientX - rect.left;
    paddleX = x - paddleW/2;
    if(paddleX<0) paddleX=0;
    if(paddleX+paddleW>canvas.width) paddleX = canvas.width-paddleW;
}

function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle="#42a5f5";
    ctx.fillRect(paddleX,paddleY,paddleW,paddleH);
    ctx.beginPath();
    ctx.arc(ballX,ballY,ballR,0,Math.PI*2);
    ctx.fillStyle="#fff";
    ctx.fill();
    bricks.forEach(b=>{
        if(b.alive){
            ctx.fillStyle="#ef5350";
            ctx.fillRect(b.x,b.y,b.w,b.h);
        }
    })
}

function update(){
    if(!gameRunning) return;
    ballX += dx;
    ballY += dy;
    if(ballX-ballR <=0 || ballX+ballR >= canvas.width) dx = -dx;
    if(ballY-ballR <=0) dy = -dy;
    if(ballY+ballR >= paddleY && ballX >= paddleX && ballX <= paddleX+paddleW){
        dy = -dy;
    }
    bricks.forEach(b=>{
        if(b.alive && ballX> b.x && ballX < b.x+b.w && ballY-ballR < b.y+b.h && ballY+ballR> b.y){
            dy = -dy;
            b.alive = false;
            score +=10;
            scoreDom.innerText = score;
        }
    })
    if(ballY > canvas.height){
        gameRunning = false;
        alert("游戏结束！得分："+score);
        resetGame();
    }
    draw();
    requestAnimationFrame(update);
}

function resetGame(){
    score = 0;
    scoreDom.innerText = score;
    ballX = canvas.width/2;
    ballY = canvas.height -60;
    dx = 2.2; dy = -2.2;
    paddleX = canvas.width/2 - paddleW/2;
    initBricks();
    draw();
}

openBtn.onclick = function(){
    modal.style.display = "flex";
    resetGame();
    gameRunning = false;
}
closeBtn.onclick = function(){
    modal.style.display = "none";
    gameRunning = false;
}
startGameBtn.onclick = function(){
    gameRunning = true;
    update();
}
</script>
<script>
const modal2048 = document.getElementById('game2048Modal');
const open2048Btn = document.getElementById('open2048Btn');
const close2048Btn = document.getElementById('close2048Btn');
const start2048Btn = document.getElementById('start2048Btn');
const scoreDom2048 = document.getElementById('score2048');
const gridWrap = document.getElementById('grid2048');

let grid = [];
let score2048 = 0;
let game2048Run = false;
// 格子颜色
const colorMap = {
    0:"#cdc1b4",
    2:"#eee4da",
    4:"#ede0c8",
    8:"#f2b179",
    16:"#f59563",
    32:"#f67c5f",
    64:"#f65e3b",
    128:"#edcf72",
    256:"#edcc61",
    512:"#edc850",
    1024:"#edc53f",
    2048:"#edc22e"
};

// 初始化4*4网格
function initGrid(){
    grid = Array(4).fill().map(()=>Array(4).fill(0));
    score2048 = 0;
    scoreDom2048.innerText = score2048;
    addRandom();
    addRandom();
    renderGrid();
}
// 随机生成2或者4
function addRandom(){
    let empty = [];
    for(let i=0;i<4;i++){
        for(let j=0;j<4;j++){
            if(grid[i][j]===0) empty.push([i,j]);
        }
    }
    if(empty.length ===0) return false;
    const [x,y] = empty[Math.floor(Math.random()*empty.length)];
    grid[x][y] = Math.random()>0.2 ? 2 :4;
    return true;
}
// 渲染页面
function renderGrid(){
    gridWrap.innerHTML = "";
    for(let i=0;i<4;i++){
        for(let j=0;j<4;j++){
            const val = grid[i][j];
            const div = document.createElement("div");
            div.style.height = "75px";
            div.style.borderRadius = "6px";
            div.style.display = "flex";
            div.style.alignItems = "center";
            div.style.justifyContent = "center";
            div.style.fontSize = val >= 1024 ? "20px" : "26px";
            div.style.fontWeight = "bold";
            div.style.background = colorMap[val] || "#333";
            div.style.color = val <=4 ? "#776e65" : "#fff";
            div.innerText = val || "";
            gridWrap.appendChild(div);
        }
    }
}

// 向左移动
function moveLeft(){
    let moved = false;
    for(let i=0;i<4;i++){
        let row = grid[i].filter(v=>v!==0);
        for(let j=0;j<row.length-1;j++){
            if(row[j] === row[j+1]){
                row[j] *=2;
                score2048 += row[j];
                row.splice(j+1,1);
            }
        }
        const newRow = Array(4).fill(0);
        row.forEach((v,idx)=>newRow[idx]=v);
        if(JSON.stringify(grid[i]) !== JSON.stringify(newRow)) moved=true;
        grid[i] = newRow;
    }
    scoreDom2048.innerText = score2048;
    return moved;
}
// 矩阵旋转
function rotate(g){
    const res = Array(4).fill().map(()=>Array(4).fill(0));
    for(let i=0;i<4;i++){
        for(let j=0;j<4;j++){
            res[j][3-i] = g[i][j];
        }
    }
    return res;
}
// 移动控制
function move(dir){
    if(!game2048Run) return;
    let moved = false;
    if(dir === "left") moved = moveLeft();
    if(dir === "right"){
        grid = rotate(rotate(grid));
        moved = moveLeft();
        grid = rotate(rotate(grid));
    }
    if(dir === "up"){
        grid = rotate(grid);
        moved = moveLeft();
        grid = rotate(rotate(rotate(grid)));
    }
    if(dir === "down"){
        grid = rotate(rotate(rotate(grid)));
        moved = moveLeft();
        grid = rotate(grid);
    }
    if(moved){
        addRandom();
        renderGrid();
        checkGameOver();
    }
}
// 判断游戏结束
function checkGameOver(){
    for(let i=0;i<4;i++){
        for(let j=0;j<4;j++){
            if(grid[i][j] ===0) return;
            const cur = grid[i][j];
            if(j+1<4 && grid[i][j+1]===cur) return;
            if(i+1<4 && grid[i+1][j]===cur) return;
        }
    }
    game2048Run = false;
    alert("游戏结束！得分："+score2048);
}

// 键盘方向键
document.onkeydown = function(e){
    if(!game2048Run) return;
    switch(e.key){
        case "ArrowLeft": move("left");break;
        case "ArrowRight": move("right");break;
        case "ArrowUp": move("up");break;
        case "ArrowDown": move("down");break;
    }
}
// 手机触屏滑动
let touchStartX = 0, touchStartY =0;
gridWrap.ontouchstart = e=>{
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
}
gridWrap.ontouchend = e=>{
    if(!game2048Run) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if(Math.abs(dx) > Math.abs(dy)){
        if(dx>30) move("right");
        else if(dx<-30) move("left");
    }else{
        if(dy>30) move("down");
        else if(dy<-30) move("up");
    }
}

open2048Btn.onclick = function(){
    modal2048.style.display = "flex";
    initGrid();
    game2048Run = false;
}
close2048Btn.onclick = function(){
    modal2048.style.display = "none";
    game2048Run = false;
}
start2048Btn.onclick = function(){
    game2048Run = true;
}
</script>


</body>
