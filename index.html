<script>
    
// 时钟代码
function updateTime(){
    const now = new Date();
    const year = now.getFullYear();
    const month = now.getMonth()+1;
    const day = now.getDate();
    const weekArr = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
    const week = weekArr[now.getDay()];
    const h = String(now.getHours()).padStart(2,'0');
    const m = String(now.getMinutes()).padStart(2,'0');
    const s = String(now.getSeconds()).padStart(2,'0');
    document.getElementById("datetime").innerText = `${year}年${month}月${day}日 ${week} ${h}:${m}:${s}`;
}
updateTime();
setInterval(updateTime,1000);
<script>
// 弹窗开关
const modal = document.getElementById('gameModal');
const openBtn = document.getElementById('openGameBtn');
const closeBtn = document.getElementById('closeGameBtn');
openBtn.onclick = ()=> modal.style.display = 'flex';
closeBtn.onclick = ()=> {modal.style.display = 'none';gameRunning = false;};

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreDom = document.getElementById('score');

let gameRunning = false;
let score = 0;
// 小球（减速！）
let ballX = canvas.width/2, ballY = canvas.height-60;
let ballR = 8;
let dx = 2.2, dy = -2.2;
// 挡板（加宽！）
let paddleW = 110, paddleH = 14;
let paddleX = canvas.width/2 - paddleW/2;
const paddleY = canvas.height - 25;
// 砖块
const row = 4, col = 7;
const brickW = 72, brickH = 16;
const brickPad = 8;
let bricks = [];

function initBricks(){
    bricks = [];
    for(let r=0;r<row;r++){
        for(let c=0;c<col;c++){
            bricks.push({
                x: c*(brickW+brickPad)+10,
                y: r*(brickH+brickPad)+10,
                w:brickW, h:brickH, alive:true
            })
        }
    }
}

// 鼠标控制
canvas.onmousemove = e=>{
    if(!gameRunning) return;
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    paddleX = x - paddleW/2;
    if(paddleX<0) paddleX=0;
    if(paddleX+paddleW>canvas.width) paddleX = canvas.width-paddleW;
}
// 触屏滑动（手机重点）
canvas.ontouchmove = e=>{
    e.preventDefault();
    if(!gameRunning) return;
    const rect = canvas.getBoundingClientRect();
    const x = e.touches[0].clientX - rect.left;
    paddleX = x - paddleW/2;
    if(paddleX<0) paddleX=0;
    if(paddleX+paddleW>canvas.width) paddleX = canvas.width-paddleW;
}

function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    // 挡板
    ctx.fillStyle="#42a5f5";
    ctx.fillRect(paddleX,paddleY,paddleW,paddleH);
    // 小球
    ctx.beginPath();
    ctx.arc(ballX,ballY,ballR,0,Math.PI*2);
    ctx.fillStyle="#fff";
    ctx.fill();
    // 砖块
    bricks.forEach(b=>{
        if(b.alive){
            ctx.fillStyle="#ef5350";
            ctx.fillRect(b.x,b.y,b.w,b.h);
        }
    })
}

function update(){
    if(!gameRunning) return;
    ballX += dx;
    ballY += dy;
    // 左右墙反弹
    if(ballX-ballR <=0 || ballX+ballR >= canvas.width) dx = -dx;
    // 顶墙反弹
    if(ballY-ballR <=0) dy = -dy;
    // 挡板碰撞
    if(ballY+ballR >= paddleY && ballX >= paddleX && ballX <= paddleX+paddleW){
        dy = -dy;
    }
    // 砖块碰撞
    bricks.forEach(b=>{
        if(b.alive && ballX> b.x && ballX < b.x+b.w && ballY-ballR < b.y+b.h && ballY+ballR> b.y){
            dy = -dy;
            b.alive = false;
            score +=10;
            scoreDom.innerText = score;
        }
    })
    // 掉到底，游戏结束
    if(ballY > canvas.height){
        gameRunning = false;
        alert("游戏结束！得分："+score);
        resetGame();
    }
    draw();
    requestAnimationFrame(update);
}

function resetGame(){
    score = 0;
    scoreDom.innerText = score;
    ballX = canvas.width/2;
    ballY = canvas.height -60;
    dx = 2.2; dy = -2.2;
    paddleX = canvas.width/2 - paddleW/2;
    initBricks();
}
// 打开弹窗自动开局
openBtn.onclick = function(){
    resetGame();
    gameRunning = true;
    update();
}
</script>

<script>
const findModal = document.getElementById('findModal');
const openFindBtn = document.getElementById('openFindBtn');
const closeFindBtn = document.getElementById('closeFindBtn');
const findScoreDom = document.getElementById('findScore');
const cavA = document.getElementById('findCanvasA');
const cavB = document.getElementById('findCanvasB');
const ctxA = cavA.getContext('2d');
const ctxB = cavB.getContext('2d');

let findScore = 0;
let answerList = [];
let gameFindRunning = false;

// 绘制基础图
function drawBase(ctx){
    ctx.fillStyle="#f7f3e9";
    ctx.fillRect(0,0,300,240);
    ctx.fillStyle="#72b872";
    ctx.beginPath();
    ctx.arc(150,120,60,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle="#333";
    ctx.beginPath();
    ctx.arc(130,105,8,0,Math.PI*2);
    ctx.arc(170,105,8,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle="#333";
    ctx.lineWidth=3;
    ctx.beginPath();
    ctx.arc(150,130,25,0.1*Math.PI,0.9*Math.PI);
    ctx.stroke();
}
// 绘制修改后的图（三处不同）
function drawDiff(ctx){
    drawBase(ctx);
    // 差异1
    ctx.fillStyle="#ff7777";
    ctx.fillRect(50,40,20,20);
    // 差异2
    ctx.fillStyle="#5588dd";
    ctx.beginPath();
    ctx.arc(240,180,12,0,Math.PI*2);
    ctx.fill();
    // 差异3
    ctx.fillStyle="#eebb44";
    ctx.fillRect(220,50,15,15);
}

function resetFindGame(){
    findScore = 0;
    findScoreDom.innerText = findScore;
    answerList = [
        {x:50,y:40,r:22},
        {x:240,y:180,r:14},
        {x:220,y:50,r:17}
    ];
    drawBase(ctxA);
    drawDiff(ctxB);
}

// 点击判断
cavB.onclick = function(e){
    if(!gameFindRunning) return;
    const rect = cavB.getBoundingClientRect();
    const scaleX = 300 / rect.width;
    const scaleY = 240 / rect.height;
    const clickX = (e.clientX - rect.left)*scaleX;
    const clickY = (e.clientY - rect.top)*scaleY;
    for(let i=answerList.length-1;i>=0;i--){
        const p = answerList[i];
        const dist = Math.hypot(clickX-p.x, clickY-p.y);
        if(dist < p.r){
            answerList.splice(i,1);
            findScore += 1;
            findScoreDom.innerText = findScore;
            if(answerList.length === 0){
                alert("🎉恭喜！全部找完啦！");
                gameFindRunning = false;
            }
            return;
        }
    }
}

openFindBtn.onclick = function(){
    findModal.style.display = "flex";
    resetFindGame();
    gameFindRunning = true;
}
closeFindBtn.onclick = function(){
    findModal.style.display = "none";
    gameFindRunning = false;
}
</script>
