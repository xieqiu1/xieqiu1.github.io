/* ========== 飘落小花小草动画代码 ========== */

<!-- 弹弹珠 JS -->
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreDom = document.getElementById('score');
const startGameBtn = document.getElementById('startGameBtn');

let gameRunning = false;
let score = 0;
let ballX = canvas.width/2, ballY = canvas.height-60;
let ballR = 8;
let dx = 2.2, dy = -2.2;
let paddleW = 110, paddleH = 14;
let paddleX = canvas.width/2 - paddleW/2;
const paddleY = canvas.height - 25;
const row = 4, col = 7;
const brickW = 72, brickH = 16;
const brickPad = 8;
let bricks = [];

function initBricks(){
    bricks = [];
    for(let r=0;r<row;r++){
        for(let c=0;c<col;c++){
            bricks.push({
                x: c*(brickW+brickPad)+10,
                y: r*(brickH+brickPad)+10,
                w:brickW, h:brickH, alive:true
            })
        }
    }
}

canvas.onmousemove = e=>{
    if(!gameRunning) return;
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    paddleX = x - paddleW/2;
    if(paddleX<0) paddleX=0;
    if(paddleX+paddleW>canvas.width) paddleX = canvas.width-paddleW;
}
canvas.ontouchmove = e=>{
    e.preventDefault();
    if(!gameRunning) return;
    const rect = canvas.getBoundingClientRect();
    const x = e.touches[0].clientX - rect.left;
    paddleX = x - paddleW/2;
    if(paddleX<0) paddleX=0;
    if(paddleX+paddleW>canvas.width) paddleX = canvas.width-paddleW;
}

function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle="#42a5f5";
    ctx.fillRect(paddleX,paddleY,paddleW,paddleH);
    ctx.beginPath();
    ctx.arc(ballX,ballY,ballR,0,Math.PI*2);
    ctx.fillStyle="#fff";
    ctx.fill();
    bricks.forEach(b=>{
        if(b.alive){
            ctx.fillStyle="#ef5350";
            ctx.fillRect(b.x,b.y,b.w,b.h);
        }
    })
}

function update(){
    if(!gameRunning) return;
    ballX += dx;
    ballY += dy;
    if(ballX-ballR <=0 || ballX+ballR >= canvas.width) dx = -dx;
    if(ballY-ballR <=0) dy = -dy;
    if(ballY+ballR >= paddleY && ballX >= paddleX && ballX <= paddleX+paddleW){
        dy = -dy;
    }
    bricks.forEach(b=>{
        if(b.alive && ballX> b.x && ballX < b.x+b.w && ballY-ballR < b.y+b.h && ballY+ballR> b.y){
            dy = -dy;
            b.alive = false;
            score +=10;
            scoreDom.innerText = score;
        }
    })
    if(ballY > canvas.height){
        gameRunning = false;
        alert("游戏结束！得分："+score);
        resetGame();
    }
    draw();
    requestAnimationFrame(update);
}

function resetGame(){
    score = 0;
    scoreDom.innerText = score;
    ballX = canvas.width/2;
    ballY = canvas.height -60;
    dx = 2.2; dy = -2.2;
    paddleX = canvas.width/2 - paddleW/2;
    initBricks();
    draw();
}
resetGame();

startGameBtn.onclick = function(){
    gameRunning = true;
    update();
}
</script>

<!-- 2048 JS -->
<script>
const scoreDom2048 = document.getElementById('score2048');
const gridWrap = document.getElementById('grid2048');
const start2048Btn = document.getElementById('start2048Btn');

let grid = [];
let score2048 = 0;
let game2048Run = false;
const colorMap = {
    0:"#cdc1b4",
    2:"#eee4da",
    4:"#ede0c8",
    8:"#f2b179",
    16:"#f59563",
    32:"#f67c5f",
    64:"#f65e3b",
    128:"#edcf72",
    256:"#edcc61",
    512:"#edc850",
    1024:"#edc53f",
    2048:"#edc22e"
};

function initGrid(){
    grid = Array(4).fill().map(()=>Array(4).fill(0));
    score2048 = 0;
    scoreDom2048.innerText = score2048;
    addRandom();
    addRandom();
    renderGrid();
}
function addRandom(){
    let empty = [];
    for(let i=0;i<4;i++){
        for(let j=0;j<4;j++){
            if(grid[i][j]===0) empty.push([i,j]);
        }
    }
    if(empty.length ===0) return false;
    const [x,y] = empty[Math.floor(Math.random()*empty.length)];
    grid[x][y] = Math.random()>0.2 ? 2 :4;
    return true;
}
function renderGrid(){
    gridWrap.innerHTML = "";
    for(let i=0;i<4;i++){
        for(let j=0;j<4;j++){
            const val = grid[i][j];
            const div = document.createElement("div");
            div.style.height = "75px";
            div.style.borderRadius = "6px";
            div.style.display = "flex";
            div.style.alignItems = "center";
            div.style.justifyContent = "center";
            div.style.fontSize = val >= 1024 ? "20px" : "26px";
            div.style.fontWeight = "bold";
            div.style.background = colorMap[val] || "#333";
            div.style.color = val <=4 ? "#776e65" : "#fff";
            div.innerText = val || "";
            gridWrap.appendChild(div);
        }
    }
}

function moveLeft(){
    let moved = false;
    for(let i=0;i<4;i++){
        let row = grid[i].filter(v=>v!==0);
        for(let j=0;j<row.length-1;j++){
            if(row[j] === row[j+1]){
                row[j] *=2;
                score2048 += row[j];
                row.splice(j+1,1);
            }
        }
        const newRow = Array(4).fill(0);
        row.forEach((v,idx)=>newRow[idx]=v);
        if(JSON.stringify(grid[i]) !== JSON.stringify(newRow)) moved=true;
        grid[i] = newRow;
    }
    scoreDom2048.innerText = score2048;
    return moved;
}
function rotate(g){
    const res = Array(4).fill().map(()=>Array(4).fill(0));
    for(let i=0;i<4;i++){
        for(let j=0;j<4;j++){
            res[j][3-i] = g[i][j];
        }
    }
    return res;
}
function move(dir){
    if(!game2048Run) return;
    let moved = false;
    if(dir === "left") moved = moveLeft();
    if(dir === "right"){
        grid = rotate(rotate(grid));
        moved = moveLeft();
        grid = rotate(rotate(grid));
    }
    if(dir === "up"){
        grid = rotate(grid);
        moved = moveLeft();
        grid = rotate(rotate(rotate(grid)));
    }
    if(dir === "down"){
        grid = rotate(rotate(rotate(grid)));
        moved = moveLeft();
        grid = rotate(grid);
    }
    if(moved){
        addRandom();
        renderGrid();
        checkGameOver();
    }
}
function checkGameOver(){
    for(let i=0;i<4;i++){
        for(let j=0;j<4;j++){
            if(grid[i][j] ===0) return;
            const cur = grid[i][j];
            if(j+1<4 && grid[i][j+1]===cur) return;
            if(i+1<4 && grid[i+1][j]===cur) return;
        }
    }
    game2048Run = false;
    alert("游戏结束！得分："+score2048);
}

document.onkeydown = function(e){
    if(!game2048Run) return;
    switch(e.key){
        case "ArrowLeft": move("left");break;
        case "ArrowRight": move("right");break;
        case "ArrowUp": move("up");break;
        case "ArrowDown": move("down");break;
    }
}
let touchStartX = 0, touchStartY =0;
gridWrap.ontouchstart = e=>{
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
}
gridWrap.ontouchend = e=>{
    if(!game2048Run) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if(Math.abs(dx) > Math.abs(dy)){
        if(dx>30) move("right");
        else if(dx<-30) move("left");
    }else{
        if(dy>30) move("down");
        else if(dy<-30) move("up");
    }
}

initGrid();
start2048Btn.onclick = function(){
    game2048Run = true;
}
<script>
document.addEventListener('DOMContentLoaded', function(){
    const cat = document.getElementById('cat');
    cat.onclick = function(e){
        // 获取小猫在页面上的坐标
        const rect = cat.getBoundingClientRect();
        const meow = document.createElement('div');
        meow.className = 'meow-text';
        meow.innerText = '喵~';
        // 起始位置：小猫旁边
        meow.style.left = rect.left + 30 + 'px';
        meow.style.top = rect.top + 'px';
        document.body.appendChild(meow);

        // 掉落动画
        let y = 0;
        let bounce = 0;
        const gravity = 2;
        let speed = 0;
        function fall(){
            speed += gravity;
            y += speed;
            meow.style.top = rect.top + y + 'px';

            // 落地反弹两次
            if(y > 80 && bounce < 2){
                speed = -speed * 0.45;
                bounce++;
            }
            // 反弹完消失
            if(bounce >=2 && speed > 0){
                meow.style.opacity = 0;
                setTimeout(()=>meow.remove(), 300);
                return;
            }
            requestAnimationFrame(fall);
        }
        fall();
    }
})
</script>
